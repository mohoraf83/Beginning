<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه اصلی</title>
    <!-- استفاده از link به جای script -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="min-h-screen bg-gray-100 flex items-center justify-center">
      <div class="bg-white p-8 rounded-lg shadow-xl max-w-2xl text-center">
        <div class="text-6xl mb-4">🚀</div>
        <h1 class="text-4xl font-bold text-blue-600 mb-4">خوش آمدید!</h1>
        <p class="text-gray-600 text-lg mb-6">
          Tailwind CSS با موفقیت در پروژه جنگو شما نصب شد.
        </p>
        <div class="flex gap-4 justify-center">
          <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg"
          >
            شروع کنید
          </button>
          <button
            class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg"
          >
            بیشتر بدانید
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
